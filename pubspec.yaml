name: fogcatcher
description: "FogCatcher - retro-RPG location game: walk to clear the fog, find what it hides."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.1

dependencies:
  app_settings: ^9.0.0
  clock: ^1.1.2
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_riverpod: ^2.6.1
  geolocator: ^14.1.1
  intl: any
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  args: ^2.7.0
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.13.1
  dart_code_linter: ^4.1.6
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/fonts/
    - assets/tiles/
    - assets/sites/
    - assets/sites/champ_de_mars/
    - assets/items/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: pack/brand/icon.png
  adaptive_icon_background: "#1D2B53"
  adaptive_icon_foreground: pack/brand/icon_foreground.png

flutter_native_splash:
  color: "#1D2B53"
  image: pack/brand/splash.png
  android_12:
    color: "#1D2B53"
    image: pack/brand/splash.png
